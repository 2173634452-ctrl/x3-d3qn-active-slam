<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>X3 · Gazebo 实际运行画面</title><style>
body{margin:0;background:#101827;color:#edf2fa;font:16px system-ui}main{max-width:1400px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 10px}p{color:#b8c7dd}#phase{padding:12px 16px;background:#20354e;border-radius:10px;margin:16px 0}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}section{background:#1b2739;padding:16px;border-radius:12px}h2{font-size:16px;margin:0 0 12px}img,video{width:100%;border-radius:8px;background:#090d14;min-height:150px}#scene,#replay{aspect-ratio:4/3;object-fit:contain}small{color:#adbed6}button,a{background:#4269b2;color:white;border:0;border-radius:7px;padding:10px 14px;text-decoration:none;display:inline-block;cursor:pointer;margin:5px 4px 5px 0}#map{max-height:290px;object-fit:contain}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style><main><h1>X3 · Gazebo 实际运行画面</h1><p>先自动采集真实转移，再离线训练 D3QN，最后加载模型自主探索。</p><div id="phase">正在连接仿真画面…</div>
<div class="grid"><section><h2 id="title">第三人称跟拍 · 实时</h2><img id="scene" src="scene.jpg"><video id="replay" controls muted loop style="display:none"></video><div style="display:none"><button onclick="live=true;renderMode()">实时画面</button><button onclick="play('collection_scene.mp4')">回放采集录像</button><button onclick="play('evaluation_scene.mp4')">回放模型运行</button></div><small id="stamp"></small></section>
<section><h2>X3 前视相机</h2><img id="front" src="front.jpg"><h2 style="margin-top:16px">估计地图 · 红色为车体，绿色为目标</h2><img id="map" src="map.jpg"></section></div><p id="detail"></p>
<small>这里显示 Gazebo 相机的实际渲染。不保存录像，只覆盖刷新最新画面。离线更新期间不运行小车。</small></main>
<script>let live=true,lastPhase='';const $=id=>document.getElementById(id);function renderMode(){$('scene').style.display=live?'block':'none';$('replay').style.display=live?'none':'block';if(live){$('replay').pause();$('title').textContent='第三人称跟拍 · 实时'}}function play(file){live=false;renderMode();$('replay').src=file;$('replay').play().catch(()=>{});$('title').textContent=file.startsWith('collection')?'回放：自动采集':'回放：模型运行'}
setInterval(async()=>{let t=Date.now();if(live){$('scene').src='scene.jpg?t='+t;$('front').src='front.jpg?t='+t;$('map').src='map.jpg?t='+t}try{let s=await(await fetch('status.json?t='+t)).json();$('phase').textContent=(s.message||s.phase).replace('画面为采集录像','保留最后一帧');$('detail').textContent=(s.detail||'').replace('下方可切换采集录像与模型运行录像。','任务结束后查看服务自动退出。');if(s.phase!==lastPhase){if(s.phase==='offline_training'){live=true;renderMode();$('title').textContent='离线训练中 · 最后一帧（未保存录像）'}if(s.phase==='evaluation'){live=true;renderMode()}if(s.phase==='complete'){live=true;renderMode();$('title').textContent='任务完成 · 最后一帧'}lastPhase=s.phase}let c=await(await fetch('camera.json?t='+t)).json();$('stamp').textContent='仿真时间 '+c.sim_time.toFixed(1)+' 秒 · 回合 '+c.episode}catch(e){}},500);</script></html>
